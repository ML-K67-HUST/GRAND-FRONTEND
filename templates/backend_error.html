<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lỗi kết nối Backend</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff0f0; color: #b00020; text-align: center; padding-top: 100px; }
        .error-box { display: inline-block; background: #fff; border: 1px solid #b00020; border-radius: 8px; padding: 32px 48px; }
        h1 { font-size: 2.2em; margin-bottom: 0.5em; }
        p { font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>Không thể kết nối tới Backend</h1>
        <p>{{ error_msg }}</p>
        <p>Vui lòng thử lại sau hoặc liên hệ quản trị viên.</p>
    </div>
</body>
</html>
